<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192" width="192" height="192">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000" flood-opacity="0.25"/>
    </filter>
  </defs>
  
  <!-- Background Rounded Shield / Tile -->
  <rect width="192" height="192" rx="38" fill="url(#grad)" />
  
  <!-- Outer Ring / Accent -->
  <rect x="8" y="8" width="176" height="176" rx="30" fill="none" stroke="rgba(255,255,255,0.15)" stroke-width="2"/>
  
  <!-- Center Shield / NOC Icon -->
  <g transform="translate(46, 36)" filter="url(#shadow)">
    <!-- Document Base -->
    <path d="M10 0 H70 L90 20 V105 A 10 10 0 0 1 80 115 H10 A 10 10 0 0 1 0 105 V10 A 10 10 0 0 1 10 0 Z" fill="#ffffff" />
    <!-- Folded Corner -->
    <path d="M70 0 V20 H90 Z" fill="#e2e8f0" />
    <!-- Lines -->
    <rect x="18" y="32" width="54" height="6" rx="3" fill="#2563eb" />
    <rect x="18" y="46" width="42" height="5" rx="2.5" fill="#94a3b8" />
    <rect x="18" y="58" width="48" height="5" rx="2.5" fill="#94a3b8" />
    <rect x="18" y="70" width="34" height="5" rx="2.5" fill="#94a3b8" />
    
    <!-- Verified Stamp / Seal badge -->
    <circle cx="68" cy="88" r="22" fill="url(#gold)" />
    <path d="M58 88 L65 95 L78 81" fill="none" stroke="#ffffff" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
